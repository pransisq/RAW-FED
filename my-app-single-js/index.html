<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Assessment</title>
    
    <link rel="stylesheet" href="styles.css"/>
    <script type="module" src="js/app.js"></script>
    
  </head>
  <body>
    <!-- Navigation Header -->
    <div class="header" id="sticky-header">
      <header class="navbar">
        <div class="logo">E-Commerce</div>
        <button
          id="cart-trigger"
          aria-label="Open Shppping Cart"
          class="cart-icon-wrapper">
          <span>🛒 Cart</span>
          <span id="cart-counter" class="badge">0</span>
        </button>
      </header>
    </div>

    <!-- Main Content Layout -->
    
    <main class="main-container">
      
       <!-- Carousel Section -->
      <div class="carousel">
        <button
          class="nav-arrow left"
          id="prevBtn"
          aria-label="Previous Product">
          &#10094;
        </button>
        <button class="nav-arrow right" id="nextBtn" aria-label="Next Product">
          &#10095;
        </button>
        <div class="carousel-track" id="track"></div>
        <div id="carouselIndicators" class="carousel-indicators"></div>
      </div>

      <!-- Product Catalog Section -->
      <section class="catalog-section">
        <h2 class="product-text">Our Products</h2>
        <div id="product-grid" class="product-grid">
          <!-- JavaScript will inject cards here dynamically -->
        </div>
      </section>
    </main>

    <!-- Shopping Cart Modal Overlay -->
    <div id="cart-modal" class="modal-overlay">
      <div class="modal-content">
        <span id="close-modal-btn" class="close-btn">&times;</span>
        <h3>Shopping Cart</h3>
        <div id="cart-items-container">
          <!-- JavaScript will inject selected items here -->
        </div>
        <div class="cart-summary">
          <p>Total Items: <span id="summary-qty">0</span></p>
          <p>Total Price: <span id="summary-total">₱0.00</span></p>
          <div class="cart-actions-row">
            <button id="empty-cart-btn" class="btn-empty">Clear Cart</button>
            <button id="checkout-btn" class="btn-checkout">
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Clear Cart Confirmation Modal -->
    <div id="clear-cart-confirm-modal" class="modal-overlay">
      <div class="modal-content text-center">
        <h3>Clear Cart?</h3>
        <p>
          Are you sure you want to remove all items from your cart? Stock
          balances will be restored.
        </p>
        <div class="modal-actions-row">
          <button id="clear-cart-cancel-btn" class="btn-cancel" type="button">
            Cancel
          </button>
          <button id="clear-cart-confirm-btn" type="button">
            Confirm
          </button>
        </div>
        <span id="clear-cart-close-btn" class="close-btn" aria-label="Close"
          >&times;</span
        >
      </div>
    </div>
    <!-- Custom Product Selection & Options Confirmation Prompt Modal -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-content text-center">
        <h3>Add To Cart</h3>
        <div id="confirm-product-details" class="product-details">
          <!-- Base product details loaded here -->
        </div>
        <!-- Dynamic Memory Option Selection Container -->
        <div class="options-container-group">
          <d>Choose Memory:</d>
          <div id="memory-options-target" class="options-button-grid">
            <!--Storage Options-->
          </div>
        </div>
        <!-- Dynamic Color Option Selection Container -->
        <div class="options-container-group">
          <p>Choose Color:</p>
          <div id="color-options-target" class="options-button-grid">
            <!--Color Options-->
          </div>
        </div>
        <!-- Quantity Selection Input Group -->
        <div class="qty-prompt-group">
          <label for="confirm-qty-input">Select Quantity:</label>
          <div class="qty-input-controls">
            <button id="qty-minus-btn" class="btn-qty-adj">-</button>
            <input
              type="number"
              id="confirm-qty-input"
              value="1"
              min="1"
              readonly />
            <button id="qty-plus-btn" class="btn-qty-adj">+</button>
          </div>
          <small id="confirm-stock-warn" class="stock-warn"></small>
        </div>
        <div class="modal-actions-row">
          <button id="confirm-cancel-btn" class="btn-cancel">Cancel</button>
          <button id="confirm-add-btn" class="btn-confirm">Confirm</button>
        </div>
      </div>
    </div>
    <!--Custom Alert Box Overlay -->
    <div id="alert-overlay" class="alert-overlay">
      <div class="alert-box">
        <span class="btn-alert-close" id="close-alert">&times;</span>
        <h3>Order Confirmed!</h3>
        <p>Thank you for shopping!</p>
        <p class="total-amount-paid">
          Total Amount Paid: <strong id="total-price"></strong>
        </p>
      </div>
    </div>

  </body>
</html>
